name: Auto PR to Develop

on:
  push:
    branches:
      - 'feature/*'
      - 'fix/*'

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
          branch: ${{ github.ref_name }}
          title: "feat: ${{ github.ref_name }}"
          body: "PR automático"
          delete-branch: false